name: AShare full-market quote snapshots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quotes.yml'
      - 'scripts/update_quotes.py'
      - 'data/stocks.json'
  schedule:
    - cron: '32,37,42,47,52,57 1 * * 1-5'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 2 * * 1-5'
    - cron: '2,7,12,17,22,27 3 * * 1-5'
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 5-6 * * 1-5'
    # Final close snapshot at 15:07 Beijing time for EOD history updates.
    - cron: '7 7 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ashare-quote-feed
  cancel-in-progress: true
jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quote test dependency
        run: python -m pip install pytest
      - name: Validate quote normalization
        run: pytest -q tests/test_quotes.py
      - name: Check market session
        id: clock
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          # Run only during the A-share session (plus the 15:07 close snapshot).
          # Pushes and manual dispatches outside these windows must not publish
          # stale/pre-market quotes as if they were live.
          t = datetime.now(ZoneInfo("Asia/Shanghai"))
          m = t.hour * 60 + t.minute
          ok = t.weekday() < 5 and (570 <= m <= 690 or 780 <= m <= 915)
          print("run=" + str(ok).lower())
          PY
      - name: Fetch complete A-share market snapshot
        if: steps.clock.outputs.run == 'true'
        run: python scripts/update_quotes.py --output /tmp/ashare-latest-quotes.json
      - name: Publish rolling public quote-feed snapshot
        if: steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin quote-feed >/dev/null 2>&1; then
            git fetch --depth=1 origin quote-feed:refs/remotes/origin/quote-feed
            git checkout -B quote-feed refs/remotes/origin/quote-feed
            mkdir -p data
            cp /tmp/ashare-latest-quotes.json data/quotes.json
            git add data/quotes.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
              git push --force-with-lease origin HEAD:quote-feed
            else
              echo 'Snapshot unchanged; no commit needed.'
            fi
          else
            git checkout --orphan quote-feed
            git rm -r --cached . >/dev/null 2>&1 || true
            mkdir -p data
            cp /tmp/ashare-latest-quotes.json data/quotes.json
            git add data/quotes.json
            git commit -m 'data: full-market A-share quote snapshot'
            git push origin HEAD:quote-feed
          fi
