name: AShare opportunity quote snapshots
run-name: A-share quote refresh (${{ github.event_name }})

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quotes.yml'
      - 'scripts/update_quotes.py'
      - 'scripts/check_quote_readiness.py'
      - 'scripts/record_intraday_signals.py'
      - 'tests/test_intraday_signal_recorder.py'
      - 'tests/test_quotes.py'
      - 'data/screen.json'
      - 'tests/test_opportunity_pool.py'
  schedule:
    # Offset to 03/08/13... UTC to reduce top-of-hour contention. GitHub may delay tasks for hours.
    # GitHub schedule is best-effort; the market-session guard is authoritative.
    - cron: '3-58/5 1-3,5-7 * * 1-5'
    # Post-close catch-up target: Beijing 15:11; delayed runs still fetch true source-time quotes.
    - cron: '11 7 * * 1-5'
  workflow_run:
    workflows: ['AShare BaoStock staged history bootstrap']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel a quote fetch already in progress when another scheduled or
# push-triggered run arrives. The job has a bounded timeout and publishes one
# rolling snapshot to quote-feed.
concurrency:
  group: ashare-quote-feed
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Preflight EOD-screened main-board candidate pool
        id: readiness
        shell: bash
        run: |
          python3 scripts/check_quote_readiness.py \
            --screen data/screen.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        if: steps.readiness.outputs.fetch == 'true'
        with:
          python-version: '3.11'
      - name: Install quote test dependency
        if: steps.readiness.outputs.fetch == 'true'
        run: python -m pip install pytest
      - name: Validate quote normalization
        if: steps.readiness.outputs.fetch == 'true'
        run: pytest -q tests/test_quotes.py
      - name: Check trigger and actual market clock
        if: steps.readiness.outputs.fetch == 'true'
        id: clock
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          t = datetime.now(ZoneInfo("Asia/Shanghai"))
          m = t.hour * 60 + t.minute
          in_session = t.weekday() < 5 and (570 <= m <= 690 or 780 <= m <= 900)
          event = os.getenv("EVENT_NAME", "")
          upstream = os.getenv("UPSTREAM_CONCLUSION", "")
          # GitHub scheduled jobs can arrive hours late. Never discard them solely
          # because it is already after the close: the upstream's REAL quote_time
          # must be checked and the true date retained in the file.
          ok = event != "workflow_run" or upstream == "success"
          print("run=" + str(ok).lower())
          print("beijing_time=" + t.isoformat(timespec="seconds"))
          print("collection_mode=" + ("intraday" if in_session else "after-hours catch-up"))
          print("trigger=" + event)
          PY
      - name: Record skipped unsuccessful upstream EOD run
        if: steps.readiness.outputs.fetch == 'true' && steps.clock.outputs.run != 'true'
        shell: bash
        run: |
          {
            echo "## A-share quote refresh"
            echo "- Result: not started because upstream EOD workflow failed"
            echo "- Beijing time: ${{ steps.clock.outputs.beijing_time }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Collection mode: ${{ steps.clock.outputs.collection_mode }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve recorder and close-confirm candidate snapshot before branch switch
        if: steps.readiness.outputs.fetch == 'true' && steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          cp scripts/record_intraday_signals.py /tmp/ashare-record-intraday.py
          cp data/screen.json /tmp/ashare-screen.json
      - name: Fetch screened opportunity watch-pool snapshot (including delayed catch-up)
        if: steps.readiness.outputs.fetch == 'true' && steps.clock.outputs.run == 'true'
        run: python scripts/update_quotes.py --output /tmp/ashare-latest-quotes.json
      - name: Validate and summarize fetched snapshot
        if: steps.readiness.outputs.fetch == 'true' && steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p = json.loads(Path("/tmp/ashare-latest-quotes.json").read_text(encoding="utf-8"))
          required = ("status", "fetched_at", "quote_time_latest", "count", "requested_count", "fresh_quote_count", "fresh_quote_pct", "quotes")
          missing = [k for k in required if k not in p]
          if missing:
              raise SystemExit("Missing quote snapshot fields: " + ", ".join(missing))
          if p["status"] != "ok" or not isinstance(p["quotes"], dict) or not p["quotes"]:
              raise SystemExit("Quote snapshot is not valid; refusing to publish")
          if int(p["count"]) != len(p["quotes"]):
              raise SystemExit("Quote count does not match quote map; refusing to publish")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## A-share quote refresh\n")
              f.write("- Result: validated; publication follows\n")
              f.write(f"- Trigger: {os.environ.get('GITHUB_EVENT_NAME', 'unknown')}\n")
              f.write(f"- Source quote time (Beijing): {p.get('quote_time_latest')}\n")
              f.write(f"- Collected at (Beijing): {p.get('fetched_at')}\n")
              f.write(f"- Opportunity pool quote coverage (not all A-shares): {p.get('count')}/{p.get('requested_count')} ({p.get('coverage_pct')}%)\n")
              f.write(f"- Fresh quotes: {p.get('fresh_quote_count')} ({p.get('fresh_quote_pct')}%)\n")
              f.write(f"- Failed batches: {p.get('failed_chunk_count')}\n")
              f.write(f"- Screening source: {p.get('universe_source')}\n")
          PY
      - name: Publish rolling public quote-feed snapshot
        if: steps.readiness.outputs.fetch == 'true' && steps.clock.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin quote-feed >/dev/null 2>&1; then
            git fetch --depth=1 origin quote-feed:refs/remotes/origin/quote-feed
            git checkout -B quote-feed refs/remotes/origin/quote-feed
            mkdir -p data
            cp /tmp/ashare-latest-quotes.json data/quotes.json
            python /tmp/ashare-record-intraday.py --screen /tmp/ashare-screen.json --quotes /tmp/ashare-latest-quotes.json --existing data/intraday_signal_events.json --output data/intraday_signal_events.json
            git add data/quotes.json data/intraday_signal_events.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
              git push --force-with-lease origin HEAD:quote-feed
              echo "- Publication: pushed updated quote-feed snapshot" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- Publication: snapshot unchanged; no commit needed" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            git checkout --orphan quote-feed
            git rm -r --cached . >/dev/null 2>&1 || true
            mkdir -p data
            cp /tmp/ashare-latest-quotes.json data/quotes.json
            python /tmp/ashare-record-intraday.py --screen /tmp/ashare-screen.json --quotes /tmp/ashare-latest-quotes.json --existing data/intraday_signal_events.json --output data/intraday_signal_events.json
            git add data/quotes.json data/intraday_signal_events.json
            git commit -m 'data: full-market A-share quote snapshot'
            git push origin HEAD:quote-feed
            echo "- Publication: created quote-feed branch and pushed snapshot" >> "$GITHUB_STEP_SUMMARY"
          fi
