name: V1.9 signal tracker CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
      - name: Compile Python modules
        run: python -m compileall -q scripts quant_v1.py
      - name: Validate browser JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/ashare-app.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/ashare-app.js
