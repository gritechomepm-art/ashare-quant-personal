name: Deploy AShare realtime Worker (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm Cloudflare Worker deployment'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ inputs.confirm == 'DEPLOY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Worker before deploying
        run: |
          node --check realtime-worker/src/index.mjs
          node --test realtime-worker/test/*.test.mjs
      - name: Verify Cloudflare deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID GitHub Actions secrets first."
            exit 1
          fi
      - name: Deploy Worker only (does not update GitHub Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config realtime-worker/wrangler.toml
      - name: Log deployment caveat
        run: |
          echo '## Realtime Worker deployed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deployment success is NOT a Tencent egress QA pass.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verify source quote_time, HTTP status, CORS and prices in a real trading session.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Only then set the actual Worker endpoint in realtime-config.js and deploy Pages.' >> "$GITHUB_STEP_SUMMARY"
