name: AShare BaoStock staged history bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baostock-backfill.yml'
      - 'scripts/ingest_baostock.py'
  schedule:
    # 17:15 Beijing on trading weekdays; use only completed EOD history.
    - cron: '15 9 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ashare-market-publish
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validated history provider and strategy
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'baostock==0.9.4'
      - name: Run existing tests
        run: pytest -q
      - name: Bootstrap bounded historical batch with explicit partial coverage
        run: python scripts/ingest_baostock.py --max-new 80 --max-seconds 700
      - name: Commit public history and partial screen only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/history/ data/screen.json data/baostock_status.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: validated BaoStock history batch [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build mobile research web app
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
