name: AShare BaoStock staged history bootstrap
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baostock-backfill.yml'
      - 'scripts/ingest_baostock.py'
      - 'scripts/build_signal_tracker.py'
      - 'scripts/record_intraday_signals.py'
      - 'scripts/core.py'
      - 'quant_v1.py'
      - 'tests/test_core.py'
      - 'tests/test_trade_signals.py'
      - 'tests/test_signal_tracker.py'
      - 'tests/test_intraday_signal_recorder.py'
  schedule:
    # 18:00 Beijing on trading weekdays; allow BaoStock's completed EOD bars to settle.
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ashare-market-publish
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install validated history provider and strategy
        run: |
          python -m pip install -r requirements.txt
          python -m pip install 'baostock==0.9.4'
      - name: Run existing tests
        run: pytest -q
      - name: Fetch latest public quote-feed snapshot
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin quote-feed >/dev/null 2>&1; then
            git fetch --depth=1 origin quote-feed
            git show FETCH_HEAD:data/quotes.json > /tmp/ashare-quote-feed.json
            if git cat-file -e FETCH_HEAD:data/intraday_signal_events.json 2>/dev/null; then
              git show FETCH_HEAD:data/intraday_signal_events.json > /tmp/ashare-intraday-events.json
            else
              echo '{"schema":1,"events":[]}' > /tmp/ashare-intraday-events.json
            fi
          else
            echo '{"schema":1,"status":"uninitialized","quotes":{}}' > /tmp/ashare-quote-feed.json
            echo '{"schema":1,"events":[]}' > /tmp/ashare-intraday-events.json
          fi
      - name: Bootstrap history and update cached bars from verified close quotes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Fast QA run for newly prioritized stocks; normal scheduled run fills 300.
            python scripts/ingest_baostock.py --quotes-file /tmp/ashare-quote-feed.json --max-new 15 --max-seconds 180
          else
            python scripts/ingest_baostock.py --quotes-file /tmp/ashare-quote-feed.json --max-new 300 --max-seconds 1000
          fi
      - name: Build historical signal outcome tracker
        run: python scripts/build_signal_tracker.py --lookback-sessions 180
      - name: Merge generated public data onto latest main with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot="$RUNNER_TEMP/ashare-new-data"
          mkdir -p "$snapshot/history"
          cp -a data/history/. "$snapshot/history/"
          cp data/stocks.json data/screen.json data/baostock_status.json data/signal_tracker.json "$snapshot/"
          cp /tmp/ashare-intraday-events.json "$snapshot/intraday_signal_events.json"
          for attempt in 1 2 3; do
            echo "Merge attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data/history
            python - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          snap = Path(os.environ["RUNNER_TEMP"]) / "ashare-new-data"
          dest = Path("data")
          hist_src = snap / "history"
          hist_dst = dest / "history"
          for incoming in hist_src.glob("*.json"):
              previous = hist_dst / incoming.name
              candidate = json.loads(incoming.read_text(encoding="utf-8"))
              if previous.exists():
                  current = json.loads(previous.read_text(encoding="utf-8"))
                  old_day = str(current.get("asof", ""))
                  new_day = str(candidate.get("asof", ""))
                  old_len = len(current.get("bars", []))
                  new_len = len(candidate.get("bars", []))
                  if new_day < old_day or (new_day == old_day and new_len < old_len):
                      continue
              shutil.copy2(incoming, previous)
          for filename in ("stocks.json", "screen.json", "baostock_status.json", "signal_tracker.json", "intraday_signal_events.json"):
              incoming = snap / filename
              previous = dest / filename
              if not previous.exists():
                  shutil.copy2(incoming, previous)
                  continue
              current = json.loads(previous.read_text(encoding="utf-8"))
              candidate = json.loads(incoming.read_text(encoding="utf-8"))
              current_day = str(current.get("asof", ""))
              candidate_day = str(candidate.get("asof", ""))
              if filename == "intraday_signal_events.json":
                  current_count = len(current.get("events", []))
                  candidate_count = len(candidate.get("events", []))
                  if candidate_count >= current_count:
                      shutil.copy2(incoming, previous)
                  continue
              if filename == "stocks.json":
                  current_count = int(current.get("count", 0))
                  candidate_count = int(candidate.get("count", 0))
              elif filename == "signal_tracker.json":
                  current_count = int(current.get("universe", {}).get("stocks_with_current_history", 0))
                  candidate_count = int(candidate.get("universe", {}).get("stocks_with_current_history", 0))
              else:
                  current_count = int(current.get("covered_count", 0))
                  candidate_count = int(candidate.get("covered_count", 0))
              if (candidate_day > current_day or
                      (candidate_day == current_day and candidate_count >= current_count)):
                  shutil.copy2(incoming, previous)
              else:
                  print(f"Keep newer {filename}: {current_day}/{current_count} > {candidate_day}/{candidate_count}")
          PY
            git add data/history/ data/screen.json data/stocks.json data/baostock_status.json data/signal_tracker.json data/intraday_signal_events.json
            if git diff --cached --quiet; then
              echo "No new public EOD data to commit."
              exit 0
            fi
            git commit -m 'data: validated BaoStock history batch [skip ci]'
            if git push origin HEAD:main; then
              echo "Published EOD data successfully."
              exit 0
            fi
            echo "Main moved during publication; retrying against the latest main."
            sleep 2
          done
          echo "Unable to publish EOD data after three attempts."
          exit 1
      - name: Build mobile research web app
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
